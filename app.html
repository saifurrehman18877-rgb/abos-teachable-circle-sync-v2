<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teachable Circle Sync v2 - App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --primary: #26A69A;
            --primary-hover: #00897B;
            --accent: #26A69A;
            --background: #F5F5F5;
            --surface: #FFFFFF;
            --text-primary: #212121;
            --text-muted: #757575;
            --border: #E0E0E0;
        }
        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--background);
            color: var(--text-primary);
        }
        .heading-font {
            font-family: 'Roboto', sans-serif;
        }
        .body-font {
            font-family: 'Roboto', sans-serif;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <nav class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <span class="text-xl font-bold text-gray-800">Teachable Circle Sync v2</span>
                </div>
                <div class="flex items-center space-x-8">
                    <a href="index.html" class="text-gray-600 hover:text-gray-800">Home</a>
                    <a href="pricing.html" class="text-gray-600 hover:text-gray-800">Pricing</a>
                    <a href="app.html" class="bg-[var(--primary)] hover:bg-[var(--primary-hover)] text-white px-4 py-2 rounded-md">Open App</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow container mx-auto px-4 py-8">
        <div class="bg-white rounded-lg shadow-md p-6">
            <h1 class="text-2xl font-bold mb-6">Find Inactive Students</h1>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <div>
                    <label for="teachableCsv" class="block text-sm font-medium text-gray-700 mb-2">Teachable CSV Export</label>
                    <textarea id="teachableCsv" rows="6" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[var(--primary)] focus:border-transparent"></textarea>
                </div>
                <div>
                    <label for="circleCsv" class="block text-sm font-medium text-gray-700 mb-2">Circle CSV Export</label>
                    <textarea id="circleCsv" rows="6" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[var(--primary)] focus:border-transparent"></textarea>
                </div>
            </div>

            <div class="mb-6">
                <label for="inactivityThreshold" class="block text-sm font-medium text-gray-700 mb-2">Inactivity Threshold (days)</label>
                <input type="number" id="inactivityThreshold" min="1" value="14" class="w-24 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[var(--primary)] focus:border-transparent">
            </div>

            <button id="findStudents" class="bg-[var(--primary)] hover:bg-[var(--primary-hover)] text-white px-4 py-2 rounded-md mb-6">Find Inactive Students</button>

            <div id="results" class="hidden">
                <h2 class="text-xl font-bold mb-4">Results</h2>
                <div class="overflow-x-auto">
                    <table class="min-w-full bg-white">
                        <thead>
                            <tr>
                                <th class="py-2 px-4 border-b border-gray-200 bg-gray-50 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
                                <th class="py-2 px-4 border-b border-gray-200 bg-gray-50 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Last Login Date</th>
                            </tr>
                        </thead>
                        <tbody id="resultsTable">
                            <!-- Results will be inserted here by JavaScript -->
                        </tbody>
                    </table>
                </div>

                <button id="downloadCsv" class="bg-[var(--primary)] hover:bg-[var(--primary-hover)] text-white px-4 py-2 rounded-md mt-6">Download CSV</button>
            </div>
        </div>
    </main>

    <script src="logic.js"></script>
    <script src="app.js"></script>
</body>
</html>
